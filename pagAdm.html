<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Administrativa</title>
    <link rel="stylesheet" href="css/ADM.css">
    <style>
        /* CSS copiado e adaptado da Alexandria para o modal de cadastro do Admin */
        :root {
            --primary: #0e64a1;
            --primary-dark: #0a4d7d;
            --secondary: #3cb371;
            --bg-gradient: linear-gradient(135deg, #0e64a1 0%, #1c5c3a 100%);
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        dialog {
            border: none;
            border-radius: 24px;
            padding: 0;
            width: min(500px, 92vw);
            max-height: 90vh;
            box-shadow: var(--shadow-lg);
            background: #ffffff;
            overflow-y: auto;
            overflow-x: hidden;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        dialog[open] {
            opacity: 1;
            transform: scale(1);
        }

        dialog::backdrop {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-header {
            background: var(--bg-gradient);
            padding: 24px;
            color: #ffffff;
            position: relative;
        }

        .modal-header h2 {
            font-size: 1.3rem;
            margin: 0;
            max-width: 85%;
        }

        .btn-fechar-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-fechar-modal:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #modalCadastro label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
        }

        #modalCadastro input,
        #modalCadastro select,
        #modalCadastro textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
            background-color: #fff;
            transition: var(--transition);
        }

        #modalCadastro textarea {
            min-height: 90px;
            resize: vertical;
        }

        #modalCadastro input:focus,
        #modalCadastro select:focus,
        #modalCadastro textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(14, 100, 161, 0.15);
        }

        .modal-actions {
            border-top: 1px solid #e2e8f0;
            padding: 20px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: #f8fafc;
        }

        .btn-salvar {
            background-color: var(--secondary);
            color: white;
        }

        .btn-salvar:hover {
            background-color: #2e8b57;
        }

        .btn-cancelar {
            background-color: var(--text-muted);
            color: white;
        }

        .btn-cancelar:hover {
            background-color: #374151;
        }
    </style>
</head>
<body>
    <header>
    <h1>Painel do Administrador</h1>
    </header>

    <div class="admin-wrap">
        <h2>Livros cadastrados</h2>
 
    <div class="admin-wrap">
        <div class="admin-card">
            <label for="livroSelect"><strong>Selecione um livro:</strong></label>
            <select id="livroSelect"></select>

            <button type="button" id="btnApagarSelecionado">Apagar (somente selecionado)</button>

            <div id="adminFeedback" aria-live="polite"></div>
        </div>
    </div>

    <form method="post">
        <button type="button" class="btn-abrir-modal" id="btnAbrirModal" >
                <span>➕</span> Registar Novo Livro
        </button>
        <!--estrutura do botao de adicionar livro-->
    <dialog id="modalCadastro">
        <form id="formCadastroLivro" method="dialog" class="modal-form">
            <div class="modal-header">
                <h2>Cadastrar novo livro</h2>
                <button type="button" class="btn-fechar-modal" id="closeModalCross" aria-label="Fechar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <label for="inputTitulo">Título</label>
                <input id="inputTitulo" name="titulo" type="text" required>

                <label for="inputAutor">Autor</label>
                <input id="inputAutor" name="autor" type="text" required>

                <label for="selectCategoria">Categoria</label>
                <select id="selectCategoria" name="categoria">
                   <option value="aventura">Aventura</option>
                        <option value="Biografia">Biografia</option>
                        <option value="conto">Conto</option>
                        <option value="Comédia">Comédia</option>
                        <option value="Cultura Geral">Cultura Geral</option>
                        <option value="Fantasia">Fantasia</option>
                        <option value="Ficção cientifica">Ficção Científica</option>
                        <option value="Ficção">Ficção</option>
                        <option value="Jornalistico">Jornalistico</option>
                        <option value="Literatura Juvenil">Literatura Juvenil</option>
                        <option value="História">História</option>
                        <option value="Mitologia">Mitologia</option>
                        <option value="Poesia">Poesia</option>
                        <option value="romance">Romance</option>
                        <option value="romance historico">Romance historico</option>
                        <option value="Suspense">Suspense</option>
                        <option value="Terror">Terror</option>
                        
                </select>

                <label for="inputImagem">URL da imagem </label>
                <input id="inputImagem" name="imagem" type="url" placeholder="https://...">

                <label for="textareaDescricao">Descrição</label>
                <textarea id="textareaDescricao" name="descricao" rows="4"></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" id="btnCancelar" class="botao btn-cancelar">Cancelar</button>
                <button type="submit" class="botao btn-salvar">Salvar livro</button>
            </div>
        </form>
    </dialog>
    </form>
   

    <!-- Removido carregamento do Script.js para evitar falhas em file:// e CORS ao inicializar outros fetches -->
    <!-- <script src="js/Script.js"></script> -->
    <script>
        async function carregarLivrosParaAdmin() {
            const feedback = document.getElementById('adminFeedback');
            try {
                if (feedback) feedback.textContent = 'Carregando livros...';

                const base = (location.protocol === 'file:') ? 'http://localhost:3000' : '';
                const resp = await fetch(base + '/api/livros');
                if (!resp.ok) {
                    const txt = await resp.text().catch(() => '');
                    console.error('Falha ao carregar livros:', resp.status, txt);
                    alert(`Erro ao carregar livros. HTTP ${resp.status}`);
                    return;
                }
                const data = await resp.json();
                // API retorna { success: true, livros: [...] }
                const livros = data?.livros;

                const select = document.getElementById('livroSelect');
                feedback.textContent = '';

                select.innerHTML = '';

                if (!Array.isArray(livros) || livros.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = 'Nenhum livro cadastrado.';
                    select.appendChild(opt);
                    select.disabled = true;
                    return;
                }

                select.disabled = false;

                livros.forEach(livro => {
                    const opt = document.createElement('option');
                    opt.value = String(livro.id);
                    opt.textContent = `${livro.titulo}`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error(e);
                alert('Erro ao carregar livros para o admin (veja console).');
            }
        }

        async function apagarLivroSelecionado() {
            const select = document.getElementById('livroSelect');
            const feedback = document.getElementById('adminFeedback');

            const id = select.value;
            if (!id) {
                feedback.textContent = 'Selecione um livro para apagar.';
                return;
            }

            // deletarLivro está em js/Script.js (delete /api/livros/:id)
            // Após deletar, recarregamos o select.
            const ok = await (async () => {
                const okConfirm = confirm('Tem certeza que deseja deletar este livro?');
                if (!okConfirm) return false;

                const base = (location.protocol === 'file:') ? 'http://localhost:3000' : '';
                const resposta = await fetch(`${base}/api/livros/${id}`, { method: 'DELETE' });
                if (!resposta.ok) {
                    let payload = null;
                    try { payload = await resposta.json(); } catch (_) {}
                    alert((payload && payload.error) ? payload.error : 'Não foi possível deletar o livro.');
                    return false;
                }
                return true;
            })();

            if (!ok) return;

            feedback.textContent = '✔️ Livro apagado com sucesso.';
            await carregarLivrosParaAdmin();
        }

        document.getElementById('btnApagarSelecionado')
            .addEventListener('click', apagarLivroSelecionado);

        window.addEventListener('load', carregarLivrosParaAdmin);

        // ==========================
        // Botão: Registar Novo Livro (mover da Alexandria para o Admin)
        // ==========================
        const modal = document.getElementById('modalCadastro');
        const btnAbrirModal = document.getElementById('btnAbrirModal');
        const formCadastro = document.getElementById('formCadastroLivro');
        const caixaFeedback = document.getElementById('adminFeedback');

        function abrirModalCadastro() {
            if (!modal) return;
            if (caixaFeedback) caixaFeedback.style.display = 'block';
            if (caixaFeedback) caixaFeedback.textContent = '';
            modal.showModal();
        }

        function fecharModalCadastro() {
            if (!modal || !formCadastro) return;
            formCadastro.reset();
            modal.close();
        }

        const closeModalCross = document.getElementById('closeModalCross');
        const btnCancelar = document.getElementById('btnCancelar');

        btnAbrirModal?.addEventListener('click', (e) => {
            e.preventDefault();
            abrirModalCadastro();
        });

        closeModalCross?.addEventListener('click', () => fecharModalCadastro());
        btnCancelar?.addEventListener('click', () => fecharModalCadastro());

        modal?.addEventListener('click', (e) => {
            if (!modal) return;
            const limitesModal = modal.getBoundingClientRect();
            const clicouDentro = (
                limitesModal.top <= e.clientY && e.clientY <= limitesModal.top + limitesModal.height &&
                limitesModal.left <= e.clientX && e.clientX <= limitesModal.left + limitesModal.width
            );
            if (!clicouDentro) fecharModalCadastro();
        });

        formCadastro?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dadosObjeto = {
                titulo: document.getElementById('inputTitulo').value.trim(),
                autor: document.getElementById('inputAutor').value.trim(),
                categoria: document.getElementById('selectCategoria').value,
                imagem: document.getElementById('inputImagem').value.trim() || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=240',
                descricao: document.getElementById('textareaDescricao').value.trim()
            };

            if (!dadosObjeto.titulo || !dadosObjeto.autor) {
                if (caixaFeedback) {
                    caixaFeedback.textContent = 'Preencha título e autor antes de salvar.';
                    caixaFeedback.style.display = 'block';
                }
                return;
            }

            try {
                const base = (location.protocol === 'file:') ? 'http://localhost:3000' : '';

                const resposta = await fetch(base + '/api/livros', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        titulo: dadosObjeto.titulo,
                        autor: dadosObjeto.autor,
                        editora: dadosObjeto.categoria,
                        ano: null
                    })
                });

                const resultado = await resposta.json().catch(() => ({}));

                if (!resposta.ok) {
                    throw new Error(resultado.error || 'Erro ao cadastrar livro');
                }

                // Confirmação visual + recarrega dropdown de livros
                if (caixaFeedback) {
                    caixaFeedback.textContent = '✔️ Livro cadastrado com sucesso!';
                    caixaFeedback.style.display = 'block';
                }

                fecharModalCadastro();
                await carregarLivrosParaAdmin();
            } catch (erro) {
                console.error('Erro ao cadastrar livro:', erro);
                if (caixaFeedback) {
                    caixaFeedback.textContent = '❌ Não foi possível cadastrar o livro.';
                    caixaFeedback.style.display = 'block';
                }
            }
        });

        </script>
</body>
</html>
