<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar - Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2a5d8f, #1c2f4b);
            color: #f4f4f4;
        }
        .card {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 18px 40px rgba(0,0,0,0.25);
            backdrop-filter: blur(12px);
        }
        .card h1 {
            margin: 0 0 10px;
            font-size: 1.9rem;
            letter-spacing: 0.02em;
        }
        .card p {
            margin: 0 0 24px;
            color: #d7e3f2;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .field {
            width: 100%;
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #d0d9e6;
        }
        .field input {
            width: 100%;
            padding: 14px 14px;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: #f8fbff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .field input:focus {
            border-color: rgba(255,255,255,0.45);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #547bbe;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #3f6d9f;
        }
        .admin-note {
            margin-top: 18px;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.65);
            text-align: center;
        }
        .admin-note a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
        }
        .admin-note a:hover {
            color: rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login do aluno</h1>
        <p>Entre no sistema da biblioteca usando seu nome de usuário e senha.</p>
        <form id="loginForm">
            <div class="field">
                <label for="usuario">Nome de usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Nome do aluno" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha do aluno" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <p class="admin-note">Acesso reservado: <a href="admin.html">login de administrador</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
